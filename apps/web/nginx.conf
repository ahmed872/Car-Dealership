# AutoHub Pro web server: serves the built SPA and proxies /api/ to the API on the same origin, so
# the session cookie (SameSite=Lax, __Host- prefix) and the CSRF double-submit work as in development
# (the SPA calls relative /api/v1/... URLs).
#
# Installed by apps/web/Dockerfile as /etc/nginx/templates/default.conf.template. At container start
# the nginx image's entrypoint substitutes ONLY ${AUTOHUB_*} variables (NGINX_ENVSUBST_FILTER):
#   AUTOHUB_API_UPSTREAM   API base URL, no path              (default http://api:3000)
#   AUTOHUB_RESOLVER       DNS resolver for the upstream name (default 127.0.0.11, Docker's DNS)
#   AUTOHUB_MAX_BODY_SIZE  upload limit; keep >= API MAX_UPLOAD_MB plus multipart overhead (default 30m)
#   AUTOHUB_REAL_IP_FROM   address/CIDR of a proxy IN FRONT of this container whose X-Forwarded-For
#                          is trusted (default 127.0.0.1/32 = nobody)
# __CSP_SCRIPT_HASHES__ is replaced at image build time with the sha256 hashes of the inline
# script(s) in index.html, so the CSP needs no 'unsafe-inline' for scripts.

# Security headers for the SPA and static files. The API sets its own (helmet), so for /api/ every
# value below is empty and nginx does not add the header.
map $uri $ah_is_api { ~^/api/ 1; default 0; }
map $ah_is_api $ah_csp {
  1 "";
  default "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}
map $ah_is_api $ah_nosniff  { 1 ""; default "nosniff"; }
map $ah_is_api $ah_frame    { 1 ""; default "DENY"; }
map $ah_is_api $ah_referrer { 1 ""; default "strict-origin-when-cross-origin"; }
map $ah_is_api $ah_coop     { 1 ""; default "same-origin"; }
map $ah_is_api $ah_corp     { 1 ""; default "same-origin"; }
# Browsers ignore HSTS on plain-HTTP responses; it takes effect once the site is served over HTTPS.
map $ah_is_api $ah_hsts     { 1 ""; default "max-age=31536000"; }
map $ah_is_api $ah_perms    { 1 ""; default "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"; }
# Hashed build assets are immutable; index.html and everything else must be revalidated.
map $uri $ah_cache {
  ~^/api/    "";
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-cache";
}
map $http_x_forwarded_proto $ah_fwd_proto { "" $scheme; default $http_x_forwarded_proto; }

log_format autohub escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
  '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"upstream_s":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  charset utf-8;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log autohub;

  # Client address. The API runs with TRUST_PROXY=true, i.e. it trusts exactly ONE hop (this
  # server) and reads the client from X-Forwarded-For, which is SET (not appended) to $remote_addr
  # below, so clients cannot spoof it. If a TLS proxy / load balancer sits in front of this
  # container, set AUTOHUB_REAL_IP_FROM to its address so $remote_addr is the real client;
  # otherwise every visitor shares one address for rate limits and audit logs (KNOWN_ISSUES KI-019).
  set_real_ip_from ${AUTOHUB_REAL_IP_FROM};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header Content-Security-Policy $ah_csp always;
  add_header X-Content-Type-Options $ah_nosniff always;
  add_header X-Frame-Options $ah_frame always;
  add_header Referrer-Policy $ah_referrer always;
  add_header Cross-Origin-Opener-Policy $ah_coop always;
  add_header Cross-Origin-Resource-Policy $ah_corp always;
  add_header Strict-Transport-Security $ah_hsts always;
  add_header Permissions-Policy $ah_perms always;
  add_header Cache-Control $ah_cache always;

  client_max_body_size ${AUTOHUB_MAX_BODY_SIZE};

  # Liveness of this container only (does not depend on the API).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    # Resolve the upstream at request time, so a recreated API container (new IP) is picked up.
    resolver ${AUTOHUB_RESOLVER} valid=10s ipv6=off;
    set $ah_upstream ${AUTOHUB_API_UPSTREAM};
    proxy_pass $ah_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $ah_fwd_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_connect_timeout 5s;
    # PDF rendering and report exports can take a while.
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    # No compression of API responses (they carry session-bound data; avoids BREACH-style leaks).
    gzip off;
  }

  location /assets/ {
    access_log off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    try_files $uri =404;
  }

  # Never serve dotfiles.
  location ~ /\. {
    return 404;
  }

  # SPA: client-side routes fall back to index.html.
  location / {
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    try_files $uri $uri/ /index.html;
  }
}
