# AutoHub Pro desktop installer. Run after `pnpm build` and `pnpm stage` in apps/desktop.
appId: pro.autohub.desktop
productName: AutoHub Pro
# AutoHub Pro.exe on Windows (the smoke test and shortcuts rely on it).
executableName: AutoHub Pro
# No auto-update channel (KI-037).
publish: null
copyright: AutoHub Pro
directories:
  output: release
  buildResources: resources
# The main process is bundled by esbuild (scripts/bundle.mjs): nothing from node_modules ships.
files:
  - dist/**/*
  - package.json
  - '!node_modules/**/*'
asar: true
# Copies stage/api/node_modules (electron-builder skips node_modules in extraResources).
afterPack: scripts/after-pack.cjs
extraResources:
  - from: stage/api
    to: api
  - from: stage/web
    to: web
  - from: stage/postgres
    to: postgres
  - from: stage/guide.pdf
    to: guide.pdf
icon: resources/icon.png
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: AutoHub-Pro-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AutoHub Pro
  # Uninstalling keeps %APPDATA%\AutoHub Pro (the database, settings and license).
  deleteAppDataOnUninstall: false
  installerLanguages: [ar_SA, en_US]
  language: '1025'
linux:
  target: [dir]
  executableName: autohub-pro
  category: Office
